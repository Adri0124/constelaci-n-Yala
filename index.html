<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constelación Yala: Mujer, Identidad y Territorio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #2c3e50;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #1b4332;
            margin-bottom: 5px;
        }
        p.subtitle {
            font-size: 1.1rem;
            color: #52796f;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 1000px;
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }
        .image-wrapper {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }
        .image-wrapper img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }
        .interactive-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background-color: #2d6a4f;
            color: white;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.3s, transform 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .interactive-btn:hover {
            background-color: #40916c;
            transform: scale(1.05);
        }
        .secondary-img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 10px;
        }
        .footer-links {
            margin-top: 15px;
        }
        .footer-links a {
            color: #2d6a4f;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>Constelación Yala: Mujer, Identidad y Territorio</h1>
        <p class="subtitle">Simulador Interactivo - Experiencia Visual y Audiovisual</p>
    </header>

    <!-- PRIMERA IMAGEN: Constelación Yala con el botón al video -->
    <div class="container">
        <div class="image-wrapper">
            <img src="Constelación_Yala__Mujer_y_Territorio.png" alt="Constelación Yala: Mujer, Identidad y Territorio">
            
            <a href="https://drive.google.com/file/d/1DD9-MWfAHlQeH5qnEh7tx6cyVE2JQv2J/view?usp=drive_link" target="_blank" class="interactive-btn">
                ▶ Ver Video Explicativo
            </a>
        </div>
        <div class="footer-links">
            <p>¿Problemas con el botón? Accede directamente al video aquí: 
                <a href="https://drive.google.com/file/d/1DD9-MWfAHlQeH5qnEh7tx6cyVE2JQv2J/view?usp=drive_link" target="_blank">
                    Abrir video de Google Drive
                </a>
            </p>
        </div>
    </div>

    <!-- SEGUNDA IMAGEN: Infografía del INTA -->
    <div class="container">
        <h2>Infografía Adicional</h2>
        <img src="Infografía__De_Yala_al_INTA.png" alt="Infografía De Yala al INTA" class="secondary-img">
    </div>

</body>
</html>
